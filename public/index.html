<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InboxFlow — Login</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f0f4ff 0%, #f8f9fa 50%, #e8f0fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
    }
    .login-card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(9,30,66,0.14);
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      overflow: hidden;
    }
    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--on-surface);
      text-align: center;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--on-surface-v);
      text-align: center;
      margin-bottom: 28px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-v);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      border: 1px solid var(--outline-v);
      border-radius: var(--radius-md);
      padding: 9px 12px 9px 36px;
      font-size: 14px;
      font-family: var(--font);
      background: var(--surface-low);
      color: var(--on-surface);
    }
    .form-control:focus {
      border-color: var(--primary-btn);
      box-shadow: 0 0 0 3px rgba(0,82,204,0.12);
      background: #fff;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--outline);
      font-size: 14px;
    }
    .input-wrapper .eye-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--outline);
      cursor: pointer;
      font-size: 14px;
    }
    .forgot-link {
      font-size: 12px;
      color: var(--primary-btn);
      float: right;
      margin-bottom: 8px;
    }
    .btn-login {
      width: 100%;
      background: var(--primary-btn);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--primary); }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider hr { flex: 1; border-color: var(--outline-v); }
    .divider span { font-size: 12px; color: var(--on-surface-v); }
    .btn-google {
      width: 100%;
      background: #fff;
      color: var(--on-surface);
      border: 1px solid var(--outline-v);
      border-radius: var(--radius-md);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }
    .btn-google:hover {
      background: var(--surface-low);
      box-shadow: var(--shadow-card);
    }
    .btn-google img {
      width: 18px;
      height: 18px;
    }
    .signup-link {
      text-align: center;
      font-size: 13px;
      color: var(--on-surface-v);
      margin-top: 20px;
    }
    .signup-link a { color: var(--primary-btn); font-weight: 600; }
    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 20px;
    }
    .error-msg {
      background: var(--error-c);
      color: var(--error);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo"><img src="/images/logo.png" alt="InboxFlow Logo"></div>
    <div class="login-title">Inbox Flow</div>
    <div class="login-sub">Turn emails into action</div>

    <div id="error-msg" class="error-msg"></div>

    <form id="login-form">
      <div class="mb-1">
        <label class="form-label">Email address</label>
      </div>
      <div class="input-wrapper">
        <i class="bi bi-envelope input-icon"></i>
        <input type="email" class="form-control" id="email" placeholder="you@company.com" required>
      </div>

      <div class="mb-1 d-flex align-items-center justify-content-between">
        <label class="form-label mb-0">Password</label>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>
      <div class="input-wrapper">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        <i class="bi bi-eye eye-toggle" id="eye-toggle"></i>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        Login <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="divider">
      <hr><span>or continue with</span><hr>
    </div>

    <a href="/auth/google" class="btn-google">
      <img src="https://www.google.com/favicon.ico" alt="Google">
      Continue with Google (Gmail)
    </a>

    <div class="signup-link">
      Don't have an account? <a href="#">Sign Up</a>
    </div>
    <div class="footer-text">© 2024 Inbox Flow. Enterprise grade security.</div>
  </div>

  <script>
    // Check if already logged in
    fetch('/auth/status', { credentials: 'include' })
      .then(r => r.json())
      .then(d => { if (d.authenticated) window.location.href = '/dashboard'; });

    // Check for error param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Google authentication failed. Please try again.';
    }

    // Password toggle
    document.getElementById('eye-toggle').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      this.className = input.type === 'password' ? 'bi bi-eye eye-toggle' : 'bi bi-eye-slash eye-toggle';
    });

    // Form submit (placeholder — real auth via Google OAuth)
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'block';
      errEl.textContent = 'Email/password login not available. Please use "Continue with Google" to sign in with your Gmail account.';
    });
  </script>
</body>
</html>
